services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: flowpilot-postgres
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5435}:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flowpilot}
      POSTGRES_USER: ${POSTGRES_USER:-flowpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowpilot_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-flowpilot} -d ${POSTGRES_DB:-flowpilot}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: flowpilot_postgres_data
